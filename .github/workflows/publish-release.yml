name: Publish verified release
on:
  workflow_dispatch:
  pull_request:
    paths:
      - docs/v100-*.md
      - tests/v100-*.cjs
      - scripts/v100-*.cjs
      - scripts/helpers/**
      - .github/workflows/v100-stable-promotion.yml
      - docs/v0188-*.md
      - tests/v0188-*.cjs
      - scripts/v0188-*.cjs
      - persistence-v0188.js
      - portrait-alt-v0188.js
      - locale-quality-v0188.js
      - .github/workflows/v0188-quality-remediation.yml
      - docs/v0187-*.md
      - docs/v0187-preview/**
      - assets/singularity/**
      - singularity-v0187.css
      - brand-preview.html
      - brand-v0187.js
      - migration/**
      - scripts/v0187-*.cjs
      - tests/v0187-*.cjs
      - release.json
      - docs/releases/**
      - scripts/verify-release.cjs
      - scripts/verify-publication-approval.cjs
      - scripts/feedback-production-check.cjs
      - .github/workflows/publish-release.yml
  push:
    branches: [main, feature/v110-es-la-localization, fix/es-la-compact-selector-pre2]
    paths:
      - docs/v110-es-la-owner-screenshot-evidence.md
      - release.json
      - .github/workflows/publish-release.yml
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-release.cjs
      - run: node tests/v0184-engine-initialization.cjs
      - run: node tests/v0184-public-baseline.cjs
      - run: node tests/v0185-feedback-production.cjs
  publish:
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    needs: [validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require final migration approval before any publication
        run: node scripts/verify-publication-approval.cjs
      - name: Verify both public migration artifacts after final approval
        run: node scripts/v0187-live-migration-check.cjs
      - name: Verify every stable asset including exact browser cache URLs
        run: node -e "if(['v1.0.0','v1.1.0-pre.1','v1.1.0-pre.2','v1.1.0-pre.3','v1.1.0-pre.4','v1.1.0-pre.5','v1.1.0-pre.6','v1.1.0-pre.7','v1.1.0-pre.8','v1.1.0-pre.9','v1.1.0-pre.11','v1.1.0-pre.14'].includes(require('./release.json').tag))require('node:child_process').execFileSync(process.execPath,['scripts/v100-live-acceptance.cjs','--publication'],{stdio:'inherit'})"
      - name: Require a connected private feedback service
        run: node scripts/feedback-production-check.cjs
      - name: Package the exact release commit
        run: |
          mkdir -p dist/release
          TZ=UTC git archive --format=zip --prefix=chloha-damage-lab/ -o dist/release/release.zip HEAD
      - name: Require exact-commit CI and deployed-content checks
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('release.json', 'utf8'));
            const required = ['Showdown differential tests', 'Showdown differential audit', 'v0.184 engine baseline', 'Damage Lab CI and status ledger', 'UI & damage regression', 'GitHub Pages live smoke'];
            if (fs.existsSync('feedback-ui-v0185.js')) required.push('v0.185 anonymous feedback');
            if (fs.existsSync('.github/workflows/v0186-accuracy-mechanics.yml')) required.push('v0.186 Accuracy & Mechanics Audit');
            if (fs.existsSync('.github/workflows/v0187-singularity-migration.yml')) required.push('v0.187 Singularity Migration');
            if (fs.existsSync('.github/workflows/v0188-quality-remediation.yml')) required.push('v0.188 Quality Remediation');
            if (['v1.1.0-pre.1','v1.1.0-pre.2','v1.1.0-pre.3','v1.1.0-pre.4','v1.1.0-pre.5','v1.1.0-pre.6','v1.1.0-pre.7','v1.1.0-pre.8','v1.1.0-pre.9','v1.1.0-pre.11','v1.1.0-pre.14'].includes(manifest.tag)) required.push('v1.1.0 ES-LA Localization');
            if (manifest.tag === 'v1.1.0-pre.14') required.push('Conditional move UI acceptance');
            if (manifest.tag === 'v1.0.0') required.push('v1.0.0 Stable Promotion');
            let verified;
            for (let attempt = 0; attempt < 160; attempt++) {
              const response = await github.rest.actions.listWorkflowRunsForRepo({...context.repo, head_sha: context.sha, branch: 'main', event: 'push', per_page: 100});
              const latest = new Map();
              for (const run of response.data.workflow_runs) {
                if (!required.includes(run.name) || run.head_sha !== context.sha) continue;
                if (!latest.has(run.name) || latest.get(run.name).id < run.id) latest.set(run.name, run);
              }
              const failed = [...latest.values()].find(run => run.status === 'completed' && run.conclusion !== 'success');
              if (failed) throw new Error(`${failed.name}: ${failed.conclusion}; release was not published`);
              if (required.every(name => latest.get(name)?.status === 'completed' && latest.get(name)?.conclusion === 'success')) {
                verified = required.map(name => latest.get(name));
                break;
              }
              core.info(`Waiting for exact-commit CI (${latest.size}/${required.length} workflows found), attempt ${attempt + 1}/160`);
              await new Promise(resolve => setTimeout(resolve, 15000));
            }
            if (!verified) throw new Error('Exact-commit CI did not complete successfully; release was not published');
            const body = fs.readFileSync(manifest.notes, 'utf8') + `\n\nCommit: \`${context.sha}\`\n\n` + verified.map(run => `- [${run.name}](${run.html_url}): completed / success`).join('\n');
            let existingRelease = null;
            try {
              existingRelease = (await github.rest.repos.getReleaseByTag({...context.repo, tag: manifest.tag})).data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (['v1.0.0','v1.1.0-pre.1','v1.1.0-pre.2','v1.1.0-pre.3','v1.1.0-pre.4','v1.1.0-pre.5','v1.1.0-pre.6','v1.1.0-pre.7','v1.1.0-pre.8','v1.1.0-pre.9','v1.1.0-pre.11','v1.1.0-pre.14'].includes(manifest.tag)) {
              const {verifyDeploymentRun} = require('./scripts/helpers/v100-deployment-proof.cjs');
              await verifyDeploymentRun({github, sourceCommit:manifest.migration.liveAcceptanceSourceCommit, runUrl:manifest.migration.liveAcceptanceDeploymentRun, expectedWorkflow:fs.readFileSync('deployment/singularity-pages.yml')});
              // CI polling can take minutes. Refresh current public bytes at the
              // publication boundary instead of relying on the early readiness check.
              require('node:child_process').execFileSync(process.execPath, ['scripts/v100-live-acceptance.cjs', '--publication'], {stdio:'inherit'});
            }
            const archive = fs.readFileSync('dist/release/release.zip');
            const {publishArchive} = require('./scripts/helpers/github-release-publication.cjs');
            const receipt = await publishArchive({github, repo:context.repo, sha:context.sha, manifest, body, archive, existingRelease});
            core.notice(`Published ${receipt.url} at ${receipt.commit}; stable=${receipt.stable}; SHA256 ${receipt.sha256}`);
