name: v0.185 anonymous feedback
on:
  pull_request:
    paths:
      - index.html
      - 'feedback-*.js'
      - locale-registry.js
      - i18n.js
      - 'services/feedback/**'
      - 'tests/v0185-feedback-*.cjs'
      - '.github/workflows/v0185-feedback.yml'
  push:
    branches: [main]
    paths:
      - index.html
      - 'feedback-*.js'
      - locale-registry.js
      - i18n.js
      - 'services/feedback/**'
      - 'tests/v0185-feedback-*.cjs'
      - '.github/workflows/v0185-feedback.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  WRANGLER_SEND_METRICS: 'false'
jobs:
  private-feedback:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked Worker dependencies
        run: npm ci --prefix services/feedback --no-audit --no-fund
      - name: Validate complete nine-language contract
        run: node tests/v0185-feedback-contract.cjs
      - name: Exercise private API, security and moderated Issue state machine
        run: npm test --prefix services/feedback
      - name: Validate the undeployed Worker bundle
        run: npm run check:bundle --prefix services/feedback
      - name: Preserve all 300 public calculation baseline cases
        run: node tests/v0184-public-baseline.cjs
      - name: Install browser test dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install chromium
      - name: Exercise nine-language UI and authenticated admin workflows
        run: node tests/v0185-feedback-browser.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feedback-browser-screenshots
          path: test-results/feedback-*.png
          if-no-files-found: ignore
