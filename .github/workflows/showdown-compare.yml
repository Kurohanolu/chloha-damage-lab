name: Showdown differential tests
on:
  pull_request:
    paths:
      - 'index.html'
      - 'damage-engine-v0184.js'
      - 'battle-data-v0184.js'
      - 'move-mechanics-data-v0184.js'
      - 'ability-data-v0184.js'
      - 'i18n.js'
      - 'names-ja-en.js'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/showdown-compare.yml'
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install chromium
      - run: npm run test:showdown
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: showdown-comparison
          path: test-results/showdown-comparison.json
          if-no-files-found: ignore
