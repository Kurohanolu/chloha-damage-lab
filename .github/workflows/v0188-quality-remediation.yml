name: v0.188 Quality Remediation
on:
  pull_request:
  push:
    branches: [main, feature/v110-es-la-localization, fix/es-la-compact-selector-pre2]
  workflow_dispatch:
permissions:
  contents: read
env:
  WRANGLER_SEND_METRICS: 'false'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  quality-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm ci --prefix services/feedback --no-audit --no-fund
      - name: Install locked independent calculation reference
        run: npm ci --prefix tests/reference --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Install fonts for nine-language evidence
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Preserve release metadata, engine bytes and fixed 300 contracts
        run: |
          node scripts/verify-release.cjs
          node tests/v0184-public-baseline.cjs
          if node -e "process.exit(['v1.1.0-pre.1','v1.1.0-pre.2','v1.1.0-pre.3','v1.1.0-pre.4','v1.1.0-pre.5','v1.1.0-pre.6','v1.1.0-pre.7','v1.1.0-pre.8','v1.1.0-pre.9','v1.1.0-pre.11','v1.1.0-pre.13'].includes(require('./release.json').tag)?0:1)"; then
            node scripts/v110-historical-contracts.cjs --suite migration
            node tests/v110-artifact-contract.cjs
          else
            node tests/v0187-migration-contract.cjs
          fi
          node tests/v0187-live-readiness.cjs
          node tests/v0187-deployment-gate.cjs
          node tests/v0186-release-gate.cjs
      - name: Exercise every v0.188 state, accessibility, locale and mobile regression
        if: ${{ !cancelled() }}
        run: node scripts/v0188-run-tests.cjs
      - name: Preserve ninety-transition language regression
        run: node tests/v0183-nine-locale-roundtrip.cjs
      - name: Recheck private feedback state machine without production writes
        run: npm test --prefix services/feedback
      - name: Build candidate assets without deployment
        if: ${{ !cancelled() }}
        run: |
          node -e "if(require('child_process').execFileSync('git',['status','--porcelain'],{encoding:'utf8'}).trim())throw Error('Candidate source must be clean before artifact generation')"
          node scripts/v0187-build-sites.cjs --output dist/v0188
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v0188-quality-audit-evidence
          path: |
            reports/v0188/
            reports/v0188-astra/
            reports/v0188-continued/
            reports/v0188-final/
            dist/v0188/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
  controlled-memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Install fonts for matched memory scenarios
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Measure controlled-GC retention and repeated state recovery
        run: node scripts/v0188-final-memory.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v0188-controlled-memory-evidence
          path: reports/v0188-final/memory.json
          if-no-files-found: error
          retention-days: 14
  performance:
    # Independent required job: test logs are available while measurements run.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm ci --prefix services/feedback --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Install fonts for comparable nine-language rendering
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Measure baseline and candidate under identical emulation conditions
        run: node scripts/v0188-browser-performance.cjs
      - name: Observe the pinned baseline or approved current public release without mutations
        if: ${{ !cancelled() }}
        run: node scripts/v0188-public-performance.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v0188-performance-audit-evidence
          path: |
            reports/v0188/browser-performance.json
            reports/v0188/public-performance.json
          if-no-files-found: error
          retention-days: 14
