name: GitHub Pages live smoke
on:
  pull_request:
    paths:
      - tests/pages-live-smoke.cjs
      - .github/workflows/pages-live-smoke.yml
  push:
    branches: [main]
    paths:
      - index.html
      - '*.js'
      - release.json
      - tests/pages-live-smoke.cjs
      - .github/workflows/pages-live-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pages-live-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install chromium
      - run: node tests/pages-live-smoke.cjs
        env:
          PAGES_BASELINE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-live-screenshots
          path: pages-live-*.png
          if-no-files-found: ignore
