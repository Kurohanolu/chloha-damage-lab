name: GitHub Pages live smoke
on:
  pull_request:
    paths:
      - release.json
      - index.html
      - '*.js'
      - scripts/v0188-*.cjs
      - scripts/helpers/v0188-*.cjs
      - tests/v0188-*.cjs
      - docs/v0187-*.md
      - docs/v0187-preview/**
      - brand-preview.html
      - brand-v0187.js
      - migration/**
      - scripts/v0187-*.cjs
      - tests/v0187-*.cjs
      - tests/pages-live-smoke.cjs
      - singularity-v0187.css
      - assets/singularity/**
      - tests/helpers/public-release-contract.cjs
      - tests/fixtures/v0184-public-baseline.json
      - tests/fixtures/v0186-baseline-corrections.json
      - .github/workflows/pages-live-smoke.yml
  push:
    branches: [main, feature/v110-es-la-localization, fix/es-la-compact-selector-pre2]
    paths:
      - docs/v110-es-la-owner-screenshot-evidence.md
      - scripts/v0188-*.cjs
      - scripts/helpers/v0188-*.cjs
      - tests/v0188-*.cjs
      - docs/v0187-*.md
      - docs/v0187-preview/**
      - brand-preview.html
      - brand-v0187.js
      - migration/**
      - scripts/v0187-*.cjs
      - tests/v0187-*.cjs
      - index.html
      - '*.js'
      - singularity-v0187.css
      - assets/singularity/**
      - release.json
      - tests/pages-live-smoke.cjs
      - tests/helpers/public-release-contract.cjs
      - tests/fixtures/v0184-public-baseline.json
      - tests/fixtures/v0186-baseline-corrections.json
      - .github/workflows/pages-live-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pages-live-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install chromium
      - name: Select one exact expected source for this publication phase
        id: expected-source
        run: node scripts/v0188-select-pages-baseline.cjs
        env:
          PAGES_EVENT_NAME: ${{ github.event_name }}
          PAGES_PR_BASE_REF: ${{ github.event.pull_request.base.sha || '' }}
      - run: node tests/pages-live-smoke.cjs
        env:
          PAGES_BASELINE_REF: ${{ steps.expected-source.outputs.baseline_ref }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-live-screenshots
          path: |
            pages-live-*.png
            pages-live-v100.json
          if-no-files-found: ignore
