name: GitHub Pages live smoke
on:
  push:
    branches: [main]
    paths:
      - index.html
      - i18n.js
      - names-*.js
      - tests/pages-live-smoke.cjs
      - .github/workflows/pages-live-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pages-live-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install chromium
      - run: node tests/pages-live-smoke.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-live-screenshots
          path: pages-live-*.png
          if-no-files-found: ignore
