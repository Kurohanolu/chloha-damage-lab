name: UI & damage regression
on:
  pull_request:
    paths:
      - index.html
      - tests/**
      - .github/workflows/ui-smoke.yml
  workflow_dispatch:
jobs:
  ui-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node tests/ui-smoke.cjs
      - run: node tests/damage-regression.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-screenshots
          path: smoke-*.png
          if-no-files-found: ignore
