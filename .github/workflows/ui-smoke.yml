name: UI & damage regression
on:
  pull_request:
    paths:
      - index.html
      - i18n.js
      - weight-power.js
      - tests/**
      - .github/workflows/ui-smoke.yml
  workflow_dispatch:
jobs:
  ui-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2 @smogon/calc
      # GitHub-hosted Ubuntu already provides browser system libraries; avoid apt network/DNS failures.
      - run: npx playwright install chromium
      - run: node tests/v0182-multi-hit.cjs
      - run: node tests/v0182-showdown-multihit.cjs
      - run: node tests/v0182-multihit-browser.cjs
      - run: node tests/v0181-weight-power.cjs
      - run: node tests/v0181-weight-data-audit.cjs
      - run: node tests/v0181-mega-weight-integrity.cjs
      - run: node tests/v0181-ui-integration.cjs
      - run: node tests/v0181-weight-browser.cjs
      - run: node tests/v0181-sprite-coverage.cjs
      - run: node tests/v0178-hiragana-suggestions.cjs
      - run: node tests/v0178-showdown-cross-compare.cjs
      - run: node tests/v0177-ci-inventory.cjs
      - run: node tests/v0177-move-policy-consistency.cjs
      - run: node tests/v0177-conditional-power-clarity.cjs
      - run: node tests/v0177-version-provenance.cjs
      - run: node tests/move-catalog-audit.cjs
      - run: node tests/v0177-engine-audit.cjs
      - run: node tests/v0177-independent-vectors.cjs
      - run: node tests/v0177-modifier-vectors.cjs
      - run: node tests/v0177-conditional-power-vectors.cjs
      - run: node tests/v0177-expanding-force-matrix.cjs
      - run: node tests/v0177-expanding-force-grounding.cjs
      - run: node tests/v0177-expanding-force-stacked.cjs
      - run: node tests/v0179-localization-coverage.cjs
      - run: node tests/v0179-localization.cjs
      - run: node tests/ui-smoke.cjs
      - run: node tests/conditional-power-ui.cjs
      - if: always()
        run: node tests/damage-regression.cjs
      - if: always()
        run: node tests/v0171-moves.cjs
      - if: always()
        run: node tests/v0171-runtime.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-screenshots
          path: |
            smoke-*.png
            cross-calculator-report.json
            english-untranslated-audit.json
          if-no-files-found: ignore
