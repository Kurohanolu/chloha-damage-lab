name: UI & damage regression
on:
  push:
    branches: [main]
    paths:
      - index.html
      - i18n.js
      - weight-power.js
      - variable-power.js
      - multi-hit.js
      - tests/**
      - data/**
      - .github/workflows/ui-smoke.yml
  pull_request:
    paths:
      - index.html
      - i18n.js
      - weight-power.js
      - variable-power.js
      - tests/**
      - data/showdown-ability-flags-v0182.json
      - .github/workflows/ui-smoke.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ui-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2 @smogon/calc
      # GitHub-hosted Ubuntu already provides browser system libraries; avoid apt network/DNS failures.
      - run: npx playwright install chromium
      - run: node tests/v0182-variable-power.cjs
      - run: node tests/v0182-fickle-beam-electro-shot.cjs
      - run: node tests/v0182-nonstandard-damage-policy.cjs
      - run: node tests/v0182-activation-assumed.cjs
      - run: node tests/v0182-grav-apple-gravity.cjs
      - run: node tests/v0182-showdown-ability-flags.cjs
      - run: node tests/v0182-attacker-ability-validation.cjs
      - run: node tests/v0182-multi-hit.cjs
      - run: node tests/v0182-showdown-multihit.cjs
      - run: node tests/v0182-multihit-browser.cjs
      - id: beat_up
        run: node tests/v0182-beat-up-browser.cjs
      - run: node tests/v0181-weight-power.cjs
      - run: node tests/v0181-weight-data-audit.cjs
      - run: node tests/v0181-mega-weight-integrity.cjs
      - run: node tests/v0181-ui-integration.cjs
      - run: node tests/v0181-weight-browser.cjs
      - run: node tests/v0181-sprite-coverage.cjs
      - run: node tests/v0178-hiragana-suggestions.cjs
      - run: node tests/v0182-bilingual-move-search.cjs
      - run: node tests/v0182-move-status-locale-toggle.cjs
      - run: node tests/v0182-type-badge-locale.cjs
      - run: node tests/v0182-all-select-locale-roundtrip.cjs
      - run: node tests/v0178-showdown-cross-compare.cjs
      - run: node tests/v0177-ci-inventory.cjs
      - run: node tests/v0177-move-policy-consistency.cjs
      - run: node tests/v0177-conditional-power-clarity.cjs
      - run: node tests/v0177-version-provenance.cjs
      - run: node tests/move-catalog-audit.cjs
      - run: node tests/v0177-engine-audit.cjs
      - run: node tests/v0177-independent-vectors.cjs
      - run: node tests/v0177-modifier-vectors.cjs
      - run: node tests/v0177-conditional-power-vectors.cjs
      - run: node tests/v0177-expanding-force-matrix.cjs
      - run: node tests/v0177-expanding-force-grounding.cjs
      - run: node tests/v0177-expanding-force-stacked.cjs
      - run: node tests/v0179-localization-coverage.cjs
      - run: node tests/v0179-localization.cjs
      - run: node tests/ui-smoke.cjs
      - run: node tests/conditional-power-ui.cjs
      - if: always()
        run: node tests/damage-regression.cjs
      - if: always()
        run: node tests/v0171-moves.cjs
      - if: always()
        run: node tests/v0171-runtime.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-screenshots
          path: |
            smoke-*.png
            cross-calculator-report.json
            english-untranslated-audit.json
          if-no-files-found: ignore
      # Publish a machine-readable CI verdict on a dedicated branch for connector-based auditing.
      # Only main pushes publish; pull requests never receive write access through this step.
      - name: Publish CI verdict
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/github-script@v7
        env:
          CI_JOB_STATUS: ${{ job.status }}
          BEAT_UP_STATUS: ${{ steps.beat_up.outcome }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const branch = 'ci-status';
            const path = 'latest-ui-smoke.json';
            const status = process.env.CI_JOB_STATUS;
            const report = {
              workflow: 'UI & damage regression',
              run_id: context.runId,
              run_attempt: context.runAttempt,
              run_url: `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`,
              commit: context.sha,
              ref: context.ref,
              status,
              beat_up_test: process.env.BEAT_UP_STATUS,
              recorded_at: new Date().toISOString()
            };
            let branchSha;
            try {
              const ref = await github.rest.git.getRef({owner, repo, ref: `heads/${branch}`});
              branchSha = ref.data.object.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
              const main = await github.rest.git.getRef({owner, repo, ref: 'heads/main'});
              await github.rest.git.createRef({owner, repo, ref: `refs/heads/${branch}`, sha: main.data.object.sha});
            }
            // Runs may finish out of order. Never let an older run overwrite a
            // newer verdict; retry if another run updates the file concurrently.
            for (let attempt = 0; attempt < 5; attempt++) {
              let fileSha;
              let previous;
              try {
                const file = await github.rest.repos.getContent({owner, repo, path, ref: branch});
                fileSha = file.data.sha;
                previous = JSON.parse(Buffer.from(file.data.content, 'base64').toString('utf8'));
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              const previousId = Number(previous?.run_id || 0);
              const previousAttempt = Number(previous?.run_attempt || 1);
              if (previousId > context.runId ||
                  (previousId === context.runId && previousAttempt > context.runAttempt)) {
                core.info(`Skipping stale CI run #${context.runId}; latest is #${previousId}`);
                break;
              }
              try {
                await github.rest.repos.createOrUpdateFileContents({
                  owner, repo, path, branch,
                  message: `ci: record UI regression run #${context.runId} (${status})`,
                  content: Buffer.from(JSON.stringify(report, null, 2) + '\n').toString('base64'),
                  ...(fileSha ? {sha: fileSha} : {})
                });
                break;
              } catch (error) {
                if (attempt === 4 || ![409, 422].includes(error.status)) throw error;
                core.warning(`Concurrent CI verdict update; retry ${attempt + 1}/5`);
              }
            }
