name: v0.184 engine baseline
on:
  pull_request:
    paths:
      - 'index.html'
      - 'battle-data-v0184.js'
      - 'move-mechanics-data-v0184.js'
      - 'ability-data-v0184.js'
      - 'damage-engine-v0184.js'
      - 'tests/v0184-engine-contract-baseline.cjs'
      - 'tests/v0184-engine-initialization.cjs'
      - '.github/workflows/v0184-engine-baseline.yml'
  workflow_dispatch:
jobs:
  engine-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate engine initialization and data loading
        run: node tests/v0184-engine-initialization.cjs
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Check baseline test syntax
        run: node --check tests/v0184-engine-contract-baseline.cjs
      - name: Validate engine contract
        run: node tests/v0184-engine-contract-baseline.cjs
