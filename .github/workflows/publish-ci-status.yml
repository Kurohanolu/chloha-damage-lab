name: Publish CI result for ChatGPT
on:
  workflow_run:
    workflows:
      - "UI & damage regression"
      - "UI and damage regression"
      - "UI damage regression"
      - "UI regression"
      - "Showdown differential audit"
    types: [completed]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Save completed run status to ci-status branch
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const run = context.payload.workflow_run;
            const fileName = run.name.replace(/[^a-zA-Z0-9_-]+/g, '-').toLowerCase();
            const path = `ci-results/${run.head_sha}/${fileName}.json`;
            const payload = {
              head_sha: run.head_sha,
              workflow: run.name,
              run_id: run.id,
              run_number: run.run_number,
              conclusion: run.conclusion,
              status: run.status,
              completed_at: run.updated_at,
              html_url: run.html_url
            };
            let sha;
            try {
              const existing = await github.rest.repos.getContent({
                ...context.repo, path, ref: 'ci-status'
              });
              sha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              ...context.repo,
              path,
              branch: 'ci-status',
              message: `ci: record ${run.name} for ${run.head_sha.slice(0, 7)}`,
              content: Buffer.from(JSON.stringify(payload, null, 2) + '\n').toString('base64'),
              ...(sha ? { sha } : {})
            });
