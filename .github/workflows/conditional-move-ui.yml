name: Conditional move UI acceptance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  count-moves:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - run: npm ci --prefix tests/reference --ignore-scripts --no-audit --no-fund
      - run: node tests/v110-translation-weather-successor.cjs
      - run: node tests/v110-pre14-weather-scope.cjs
      - run: node tests/v110-pre14-publication.cjs
      - run: node tests/v110-count-moves-showdown.cjs
      - run: node tests/v110-count-moves-copy.cjs
      - run: node tests/v110-count-moves-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conditional-move-ui-evidence
          path: reports/v110/
          if-no-files-found: error
