name: Conditional move UI acceptance
on:
  pull_request:
    paths:
      - locale-quality-v0188.js
      - index.html
      - tests/v110-count-moves-*.cjs
      - .github/workflows/conditional-move-ui.yml
  push:
    branches: [main]
    paths:
      - locale-quality-v0188.js
      - tests/v110-count-moves-*.cjs
permissions:
  contents: read
jobs:
  count-moves:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - run: node tests/v110-count-moves-copy.cjs
      - run: node tests/v110-count-moves-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conditional-move-ui-evidence
          path: reports/v110/count-moves-browser.json
          if-no-files-found: error
